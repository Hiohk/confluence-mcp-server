server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: confluence_mcp_server
  ai:
    mcp:
      server:
        enabled: true
        name: confluence_mcp_server
        version: 1.0.0
        transport: WEBMVC
        type: SYNC
        annotation-scanner:
          enabled: true
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        path: /mcp
        capabilities:
          tool: true

# Actuator健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

logging:
  level:
    root: INFO
    com.confluence.mcp: DEBUG
    io.modelcontextprotocol: INFO
    org.springframework.ai.mcp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

confluence:
  url: ${CONFLUENCE_URL:xxxxxx}
  username: ${CONFLUENCE_USERNAME:xxxxxx}
  password: ${CONFLUENCE_PASSWORD:xxxxxx}
  default-space: ${CONFLUENCE_DEFAULT_SPACE:ZXJXTECH}
  default-content-type: ${CONFLUENCE_DEFAULT_CONTENT_TYPE:page,blogpost}
  default-search-limit: ${CONFLUENCE_DEFAULT_SEARCH_LIMIT:10}
  max-search-limit: ${CONFLUENCE_MAX_SEARCH_LIMIT:100}
  connection-timeout: ${CONFLUENCE_CONNECTION_TIMEOUT:30000}
  read-timeout: ${CONFLUENCE_READ_TIMEOUT:30000}
  max-pool-size: ${CONFLUENCE_MAX_POOL_SIZE:100}
  max-pool-per-route: ${CONFLUENCE_MAX_POOL_PER_ROUTE:20}
